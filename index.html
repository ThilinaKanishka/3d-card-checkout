<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Nova Pay</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%238b5cf6'/%3E%3Crect x='2' y='11' width='28' height='4' fill='%231e1b4b'/%3E%3C/svg%3E"
    />
    <!-- Card typefaces: OCR-style digits and a clean sans for the bank name (system fallbacks in card.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Share+Tech+Mono&display=swap"
    />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <!-- Decorative background glow -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
      <div class="absolute -top-40 -left-32 h-112 w-md rounded-full bg-indigo-600/25 blur-3xl"></div>
      <div class="absolute -right-32 -bottom-40 h-120 w-120 rounded-full bg-fuchsia-600/20 blur-3xl"></div>
    </div>

    <!-- Pages are rendered here by src/main.ts (hash router: #/login, #/signup, #/checkout). -->
    <div id="app"></div>
    <noscript>
      <p class="p-10 text-center text-slate-300">Nova Pay needs JavaScript to run.</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
